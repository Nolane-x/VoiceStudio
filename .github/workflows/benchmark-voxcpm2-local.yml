name: Local VoxCPM2 CPU voice-design benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/benchmark_voxcpm2_local.py"
      - "tests/test_voxcpm2_local_benchmark.py"
      - "docs/voxcpm2-local-evaluation.md"
      - ".github/workflows/benchmark-voxcpm2-local.yml"
      - "scripts/build_voice_library.py"
      - "backend/services/watermark.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voxcpm2-local-cpu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_ETAG_TIMEOUT: "60"
  HF_HUB_DOWNLOAD_TIMEOUT: "600"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  contract:
    name: Local-only model and benchmark contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Validate local-only contract
        run: |
          python scripts/benchmark_voxcpm2_local.py --check
          python tests/test_voxcpm2_local_benchmark.py

  cpu-inference:
    name: VoxCPM2 voice design on GitHub-hosted CPU
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      HF_HOME: /tmp/voxcpm2-hf-home
      HF_HUB_CACHE: /tmp/voxcpm2-hf-home/hub
      AUDIOSEAL_CACHE_DIR: /tmp/voxcpm2-audioseal
      TORCH_HOME: /tmp/voxcpm2-torch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install audio runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1
      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.8.0" "torchaudio==2.8.0"
      - name: Install pinned local TTS and provenance dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "voxcpm==2.0.3" \
            "audioseal>=0.1.3" \
            "soundfile>=0.12.1" \
            "numpy<3" \
            "jsonschema>=4.25,<5"
          python -m pip check
          python -c "import torch, torchaudio; print('torch', torch.__version__, 'torchaudio', torchaudio.__version__); assert '+cpu' in torch.__version__"
          python -c "from voxcpm import VoxCPM; print('VoxCPM package import: OK')"
      - name: Generate local Vietnamese and English voice designs
        run: python scripts/benchmark_voxcpm2_local.py --output dist/voxcpm2-local
      - name: Upload anonymous listening samples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: voxcpm2-local-blind-review-${{ github.run_id }}
          path: dist/voxcpm2-local/blind-review/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload model mapping and technical analysis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: voxcpm2-local-analysis-${{ github.run_id }}
          path: |
            dist/voxcpm2-local/analysis/
            dist/voxcpm2-local/SUMMARY.md
          if-no-files-found: warn
          retention-days: 30
