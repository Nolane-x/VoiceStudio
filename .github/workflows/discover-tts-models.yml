name: Discover trending TTS models

on:
  push:
    branches: [feat/tts-quality-benchmark]
    paths:
      - "scripts/discover_tts_models.py"
      - "tests/test_discover_tts_models.py"
      - "voice-library/expansion-sources.json"
      - ".github/workflows/discover-tts-models.yml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum public Hub models per signal query (1-100)
        required: true
        type: number
        default: 40

permissions:
  contents: read

concurrency:
  group: tts-model-discovery
  cancel-in-progress: false

jobs:
  discover:
    name: Snapshot trending English and Vietnamese TTS models
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install the small test runner
        run: python -m pip install --disable-pip-version-check "pytest>=9,<10"
      - name: Compile and test the discovery collector
        run: |
          python -m py_compile scripts/discover_tts_models.py
          python -m pytest -q tests/test_discover_tts_models.py
      - name: Collect public Hub signals without downloading model files
        env:
          MODEL_LIMIT: ${{ inputs.limit || '40' }}
        run: |
          python scripts/discover_tts_models.py --limit "$MODEL_LIMIT" --output dist/tts-discovery
      - name: Upload the dated discovery snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tts-model-discovery-${{ github.run_id }}
          path: dist/tts-discovery/
          if-no-files-found: error
          retention-days: 30
