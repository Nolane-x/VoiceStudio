name: ElevenLabs Eleven v4 marketplace quality benchmark

on:
  workflow_dispatch:
    inputs:
      language:
        description: Marketplace language pool to benchmark
        required: true
        type: choice
        options: [both, vi, en]
        default: both
      offset:
        description: Zero-based offset in each language's adoption-sorted marketplace pool
        required: true
        type: number
        default: 0
      limit:
        description: Number of voices per selected language (max 4; both creates at most 8 samples)
        required: true
        type: number
        default: 2
      pages_per_query:
        description: Discovery pages per sort/category query (100 voices per page; max 5)
        required: true
        type: number
        default: 2
      confirm_paid_api_usage:
        description: Explicitly approve up to 8 paid Eleven v4 synthesis requests
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: eleven-v4-marketplace-benchmark-${{ github.ref }}-${{ inputs.language }}-${{ inputs.offset }}
  cancel-in-progress: false

jobs:
  paid-benchmark:
    name: Render matched Eleven v4 samples from popular shared voices
    if: ${{ github.event.repository.private == true && inputs.confirm_paid_api_usage == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      HF_HOME: /tmp/voice-studio-eleven-v4/hf
      HF_HUB_CACHE: /tmp/voice-studio-eleven-v4/hf/hub
      AUDIOSEAL_CACHE_DIR: /tmp/voice-studio-eleven-v4/audioseal
      TORCH_HOME: /tmp/voice-studio-eleven-v4/torch
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_ETAG_TIMEOUT: "30"
      HF_HUB_DOWNLOAD_TIMEOUT: "240"
      OMP_NUM_THREADS: "4"
    steps:
      - name: Check out VoiceStudio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Validate bounded request and credentials
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          REQUEST_LANGUAGE: ${{ inputs.language }}
          REQUEST_LIMIT: ${{ inputs.limit }}
          REQUEST_OFFSET: ${{ inputs.offset }}
          REQUEST_PAGES: ${{ inputs.pages_per_query }}
        run: |
          test -n "$ELEVENLABS_API_KEY" || {
            echo "::error::Set ELEVENLABS_API_KEY in repository Actions secrets."
            exit 1
          }
          python - <<'PY'
          import os
          language = os.environ["REQUEST_LANGUAGE"] or "both"
          limit = int(os.environ["REQUEST_LIMIT"] or "2")
          offset = int(os.environ["REQUEST_OFFSET"] or "0")
          pages = int(os.environ["REQUEST_PAGES"] or "2")
          assert language in {"both", "vi", "en"}
          assert 1 <= limit <= 4
          assert 0 <= offset <= 100000
          assert 1 <= pages <= 5
          assert limit * (2 if language == "both" else 1) <= 8
          PY
      - name: Install FFmpeg and audio runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1
      - name: Install pinned CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            "torch==2.8.0" "torchaudio==2.8.0"
      - name: Install watermark and audio dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "audioseal>=0.1.3" \
            "soundfile>=0.12.1" \
            "pytest"
      - name: Run Eleven v4 benchmark contract tests
        run: |
          python -m pytest \
            tests/test_elevenlabs_v4_marketplace_benchmark.py \
            tests/test_elevenlabs_shared_voice_discovery.py -q
      - name: Render bounded paid Eleven v4 benchmark
        id: generate
        continue-on-error: true
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          REQUEST_LANGUAGE: ${{ inputs.language }}
          REQUEST_OFFSET: ${{ inputs.offset }}
          REQUEST_LIMIT: ${{ inputs.limit }}
          REQUEST_PAGES: ${{ inputs.pages_per_query }}
        run: |
          python scripts/benchmark_elevenlabs_v4_marketplace.py \
            --language "${REQUEST_LANGUAGE:-both}" \
            --offset "${REQUEST_OFFSET:-0}" \
            --limit "${REQUEST_LIMIT:-2}" \
            --pages-per-query "${REQUEST_PAGES:-2}" \
            --output dist/elevenlabs-v4-benchmark \
            --confirm-paid-api-usage
      - name: Upload anonymized blind listening archive
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eleven-v4-blind-review-${{ github.run_id }}
          path: dist/elevenlabs-v4-benchmark/blind-listening-review.zip
          if-no-files-found: warn
          retention-days: 14
      - name: Upload private voice mapping and quality manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eleven-v4-analysis-${{ github.run_id }}
          path: |
            dist/elevenlabs-v4-benchmark/analysis.json
            dist/elevenlabs-v4-benchmark/README.md
          if-no-files-found: warn
          retention-days: 14
      - name: Fail the run if any provider voice did not pass
        if: steps.generate.outcome == 'failure'
        run: |
          echo "::error::The Eleven v4 batch had one or more failed requests or audio checks. Inspect the partial analysis artifact; do not retry unknown outcomes without reconciling provider history."
          exit 1

  no-paid-calls:
    name: No paid ElevenLabs generation requests made
    if: ${{ github.event.repository.private != true || inputs.confirm_paid_api_usage != true }}
    runs-on: ubuntu-24.04
    steps:
      - name: Explain the two explicit safety gates
        run: |
          echo "No ElevenLabs Eleven v4 synthesis request was sent and no TTS credits were used."
          echo "The repository must be private and confirm_paid_api_usage must be true."
          echo "The maximum batch is eight requests: four voices per selected language."
