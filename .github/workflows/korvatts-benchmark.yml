name: KorvaTTS Vietnamese CPU benchmark

on:
  push:
    branches:
      - feat/korvatts-vietnamese-cpu-benchmark
    paths:
      - ".github/workflows/korvatts-benchmark.yml"
      - "scripts/benchmark_korvatts_cpu.py"
      - "scripts/build_voice_library.py"

permissions:
  contents: read

concurrency:
  group: korvatts-cpu-benchmark-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HF_HOME: /tmp/korvatts-hf-home
  HF_HUB_CACHE: /tmp/korvatts-hf-home/hub
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_ETAG_TIMEOUT: "30"
  HF_HUB_DOWNLOAD_TIMEOUT: "180"
  AUDIOSEAL_CACHE_DIR: /tmp/korvatts-audioseal
  TORCH_HOME: /tmp/korvatts-torch
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  benchmark:
    name: Generate ten Vietnamese styles on local CPU
    if: ${{ github.ref == 'refs/heads/feat/korvatts-vietnamese-cpu-benchmark' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout pinned benchmark branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install FFmpeg and audio runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install CPU PyTorch and local TTS dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            "torch==2.8.0" "torchaudio==2.8.0"
          python -m pip install --disable-pip-version-check \
            "korvatts==0.1.3" \
            "onnxruntime==1.31.1" \
            "numpy<3" \
            "audioseal>=0.1.3" \
            "soundfile>=0.12.1" \
            "huggingface_hub>=1.7,<2"
          python -m pip check
          python -c "import onnxruntime, korvatts, torch; print('ONNX Runtime', onnxruntime.__version__); print('KorvaTTS', korvatts.__version__); print('Torch', torch.__version__)"

      - name: Verify benchmark contracts
        run: |
          python scripts/benchmark_korvatts_cpu.py --check
          python tests/test_korvatts_cpu_benchmark.py

      - name: Generate and validate the Vietnamese voice-style matrix
        run: python scripts/benchmark_korvatts_cpu.py --output dist/korvatts-cpu

      - name: Upload anonymous listening samples and technical analysis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: korvatts-local-cpu-${{ github.run_id }}
          path: dist/korvatts-cpu/
          if-no-files-found: warn
          retention-days: 14
