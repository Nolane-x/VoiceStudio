name: Discover Grok built-in Vietnamese and English voices

on:
  push:
    branches:
      - feat/tts-quality-benchmark
    paths:
      - .github/workflows/discover-grok-builtin-voices.yml
      - scripts/discover_grok_builtin_voices.py
      - tests/test_grok_builtin_voice_discovery.py
  schedule:
    - cron: "55 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grok-builtin-voice-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    name: Snapshot xAI provider-managed built-in voices
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out VoiceStudio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Test built-in-only discovery contract
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest tests/test_grok_builtin_voice_discovery.py -q

      - name: Discover provider-managed voices (metadata only)
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          if [ -n "$XAI_API_KEY" ]; then
            python scripts/discover_grok_builtin_voices.py \
              --output dist/grok-builtin-voices
          else
            mkdir -p dist/grok-builtin-voices
            cp voice-library/grok-builtin-studio-voices.json dist/grok-builtin-voices/catalog.json
            cat > dist/grok-builtin-voices/README.md <<'EOF'
          # Grok built-in voice discovery — static provider documentation snapshot

          The official xAI List TTS Voices endpoint requires XAI_API_KEY, which
          is not configured in repository Actions secrets. This artifact falls
          back to the checked-in 25-option provider documentation snapshot.
          Dynamic API refresh was skipped. No audio was generated or paid TTS
          request sent. Configure XAI_API_KEY and rerun for a live API snapshot.
          EOF
            echo "::notice::XAI_API_KEY is not configured; uploaded the static official voice menu snapshot."
          fi

      - name: Upload Grok built-in voice metadata snapshot or setup report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grok-builtin-voices-${{ github.run_id }}
          path: dist/grok-builtin-voices/
          if-no-files-found: error
          retention-days: 30
