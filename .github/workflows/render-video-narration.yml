name: Render video narration (reusable)

on:
  workflow_call:
    inputs:
      job_json:
        description: "Validated English/Vietnamese narration job JSON"
        required: true
        type: string

permissions:
  contents: read

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_ETAG_TIMEOUT: "30"
  HF_HUB_DOWNLOAD_TIMEOUT: "180"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  validate:
    name: Validate narration request and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Nolane-x/VoiceStudio
          ref: main
          path: voice-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema>=4.25,<5"
      - name: Validate renderer and catalog contracts
        working-directory: voice-source
        run: |
          python scripts/build_voice_library.py --check
          python scripts/render_video_voice.py --check
          python tests/test_voice_library_contract.py
          python tests/test_video_voice_contract.py
      - name: Validate supplied video job JSON
        env:
          VOICE_JOB_JSON: ${{ inputs.job_json }}
        working-directory: voice-source
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path
          import jsonschema

          schema = json.loads(Path("voice-library/video-job.schema.json").read_text(encoding="utf-8"))
          payload = json.loads(os.environ["VOICE_JOB_JSON"])
          jsonschema.validate(payload, schema)
          spec = importlib.util.spec_from_file_location("render_video_voice", Path("scripts/render_video_voice.py"))
          if spec is None or spec.loader is None:
              raise SystemExit("Unable to load the video narration renderer for preflight")
          renderer = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(renderer)
          renderer.validate_job_payload(payload)
          plan = renderer.plan_rendered_chunks(payload["segments"])
          print(
              f"Validated {payload.get('job_id', 'unnamed')}: {payload['language']} / "
              f"{payload['engine']} / {len(payload['segments'])} segments / "
              f"{len(plan)} packed TTS chunks"
          )
          PY

  render:
    name: Synthesize, master and verify WAV
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      HF_HOME: /tmp/voice-job-hf-home
      HF_HUB_CACHE: /tmp/voice-job-hf-home/hub
      AUDIOSEAL_CACHE_DIR: /tmp/voice-job-audioseal
      TORCH_HOME: /tmp/voice-job-torch
      VOICE_JOB_JSON: ${{ inputs.job_json }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Nolane-x/VoiceStudio
          ref: main
          path: voice-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install FFmpeg and audio runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 espeak-ng
      - name: Install pinned CPU TTS and watermark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            "torch==2.8.0" "torchaudio==2.8.0"
          python -m pip install --disable-pip-version-check \
            "piper-tts==1.8.0" \
            "vieneu==3.8.3" \
            "kokoro==0.9.4" \
            "misaki[en]==0.9.4" \
            "audioseal>=0.1.3" \
            "soundfile>=0.12.1" \
            "huggingface_hub>=0.28" \
            "jsonschema>=4.25,<5"
      - name: Synthesize, master, watermark and verify the narration
        working-directory: voice-source
        run: python scripts/render_video_voice.py --output dist/video-voice
      - name: Upload reusable narration artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: video-voice-assets-${{ github.run_id }}
          path: voice-source/dist/video-voice/
          if-no-files-found: warn
          retention-days: 14
