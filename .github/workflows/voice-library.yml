name: English and Vietnamese voice library

on:
  pull_request:
    branches: [main]
    paths:
      - "voice-library/**"
      - "scripts/build_voice_library.py"
      - "tests/test_voice_library_contract.py"
      - ".github/workflows/voice-library.yml"
      - "backend/services/watermark.py"
      - "backend/core/prefs.py"
      - "backend/core/render_trace.py"
  push:
    branches: [main]
    paths:
      - "voice-library/**"
      - "scripts/build_voice_library.py"
      - "tests/test_voice_library_contract.py"
      - ".github/workflows/voice-library.yml"
      - "backend/services/watermark.py"
      - "backend/core/prefs.py"
      - "backend/core/render_trace.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voice-library-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_ETAG_TIMEOUT: "30"
  HF_HUB_DOWNLOAD_TIMEOUT: "180"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  contract:
    name: Source, schema and provenance contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install validation tools
        run: python -m pip install --disable-pip-version-check "jsonschema>=4.25,<5"
      - name: Validate static contracts
        run: |
          python scripts/build_voice_library.py --check
          python tests/test_voice_library_contract.py

  smoke:
    name: Real-model smoke build (two voices per source)
    needs: contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      HF_HOME: ${{ runner.temp }}/hf-home
      HF_HUB_CACHE: ${{ runner.temp }}/hf-home/hub
      AUDIOSEAL_CACHE_DIR: ${{ runner.temp }}/audioseal
      TORCH_HOME: ${{ runner.temp }}/torch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install FFmpeg and audio runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1
      - name: Install CPU PyTorch and audio dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            "torch==2.8.0" "torchaudio==2.8.0"
          python -m pip install --disable-pip-version-check \
            "piper-tts==1.8.0" \
            "vieneu==3.8.3" \
            "audioseal>=0.1.3" \
            "soundfile>=0.12.1" \
            "huggingface_hub>=0.28" \
            "jsonschema>=4.25,<5"
      - name: Generate and verify smoke voices
        run: |
          python scripts/build_voice_library.py \
            --language all \
            --limit 2 \
            --output dist/voice-library-smoke
      - name: Upload smoke audio and manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: voice-library-smoke
          path: dist/voice-library-smoke/
          if-no-files-found: warn
          retention-days: 7

  build-and-publish:
    name: Full voice library and release assets
    needs: contract
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      HF_HOME: ${{ runner.temp }}/hf-home
      HF_HUB_CACHE: ${{ runner.temp }}/hf-home/hub
      AUDIOSEAL_CACHE_DIR: ${{ runner.temp }}/audioseal
      TORCH_HOME: ${{ runner.temp }}/torch
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install FFmpeg and audio runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1
      - name: Install CPU PyTorch and audio dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            "torch==2.8.0" "torchaudio==2.8.0"
          python -m pip install --disable-pip-version-check \
            "piper-tts==1.8.0" \
            "vieneu==3.8.3" \
            "audioseal>=0.1.3" \
            "soundfile>=0.12.1" \
            "huggingface_hub>=0.28" \
            "jsonschema>=4.25,<5"
      - name: Build all eligible English and Vietnamese voices
        run: |
          python scripts/build_voice_library.py \
            --language all \
            --output dist/voice-library
      - name: Validate the generated manifest and archives
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import jsonschema

          root = Path("dist/voice-library")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          schema = json.loads(Path("voice-library/manifest.schema.json").read_text(encoding="utf-8"))
          jsonschema.validate(manifest, schema)
          assert manifest["counts"]["en"] >= 760, manifest["counts"]
          assert manifest["counts"]["vi"] >= 20, manifest["counts"]
          assert manifest["counts"]["unique_voice_identities"] >= 780, manifest["counts"]
          for lang in ("en", "vi"):
              archive = root / manifest["archives"][lang]["file"]
              digest = hashlib.sha256(archive.read_bytes()).hexdigest()
              assert digest == manifest["archives"][lang]["sha256"], lang
          assert all(v["watermark"] == "verified" for v in manifest["voices"])
          print(json.dumps(manifest["counts"], ensure_ascii=False, indent=2))
          PY
      - name: Upload reproducible build artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: voice-library-full-build
          path: dist/voice-library/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish the rolling, non-latest voice-library release
        run: |
          set -euo pipefail
          TAG="voice-library-latest"
          NOTES="dist/voice-library/build-summary.txt"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Nolane English & Vietnamese Voice Library" \
              --notes-file "$NOTES" \
              --prerelease
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nolane English & Vietnamese Voice Library" \
            --notes-file "$NOTES"
          gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            dist/voice-library/voice-library-en.zip \
            dist/voice-library/voice-library-vi.zip \
            dist/voice-library/manifest.json \
            dist/voice-library/rejected-voices.json \
            dist/voice-library/build-summary.txt
