name: ZeroTTS Vietnamese CPU benchmark

on:
  push:
    branches:
      - experiment/zerotts-vietnamese-cpu-benchmark
    paths:
      - ".github/workflows/zerotts-vietnamese-cpu.yml"
      - "scripts/benchmark_zerotts_local.py"
      - "tests/test_zerotts_local_benchmark.py"
      - "docs/zerotts-local-evaluation.md"

permissions:
  contents: read

concurrency:
  group: zerotts-vietnamese-cpu-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HF_HOME: /tmp/zerotts-hf-home
  HF_HUB_CACHE: /tmp/zerotts-hf-home/hub
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_ETAG_TIMEOUT: "30"
  HF_HUB_DOWNLOAD_TIMEOUT: "180"
  AUDIOSEAL_CACHE_DIR: /tmp/zerotts-audioseal
  TORCH_HOME: /tmp/zerotts-torch
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  benchmark:
    name: Eight Vietnamese presets, text cases and streaming on CPU
    if: ${{ github.ref == 'refs/heads/experiment/zerotts-vietnamese-cpu-benchmark' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout benchmark branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install FFmpeg and audio runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 libportaudio2

      - name: Download and verify the provenance-pinned ZeroTTS wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip download --disable-pip-version-check --no-deps --only-binary=:all:             --dest /tmp/zerotts-wheel "zerotts==0.1.5"
          printf '%s  %s\n' "9b4ceade901c224db33f675794c2c2f7c6d9190fd8f97b74c85efe62cef1c04b" "/tmp/zerotts-wheel/zerotts-0.1.5-py3-none-any.whl" | sha256sum --check -

      - name: Install CPU-only PyTorch for AudioSeal provenance checks
        run: |
          python -m pip install --disable-pip-version-check             --index-url https://download.pytorch.org/whl/cpu             --extra-index-url https://pypi.org/simple             "torch==2.8.0" "torchaudio==2.8.0"

      - name: Install pinned ZeroTTS and audio dependencies
        run: |
          python -m pip install --disable-pip-version-check             /tmp/zerotts-wheel/zerotts-0.1.5-py3-none-any.whl             "onnxruntime==1.31.1"             "numpy<3"             "tokenizers>=0.20,<1"             "huggingface_hub>=1.7,<2"             "soundfile>=0.12.1"             "scipy>=1.10"             "sounddevice>=0.5.2"             "audioseal>=0.1.3"
          python -m pip check
          python -c "import importlib.metadata, zerotts; print('distribution:', importlib.metadata.version('zerotts')); print('module __version__:', zerotts.__version__); print('ZeroTTS import: OK')"
          python -c "import onnxruntime as ort; print('ONNX Runtime:', ort.__version__, 'providers:', ort.get_available_providers()); assert 'CPUExecutionProvider' in ort.get_available_providers()"

      - name: Verify ZeroTTS benchmark contracts
        run: |
          python scripts/benchmark_zerotts_local.py --check
          python tests/test_zerotts_local_benchmark.py

      - name: Generate Vietnamese presets and streaming samples
        run: python scripts/benchmark_zerotts_local.py --output dist/zerotts-cpu

      - name: Upload anonymous listening samples and technical analysis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zerotts-vietnamese-cpu-${{ github.run_id }}
          path: dist/zerotts-cpu/
          if-no-files-found: warn
          retention-days: 30
