name: Build voice design profile catalog

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/generate_voice_design_profiles.py"
      - "tests/test_voice_design_profiles.py"
      - "voice-library/voice-design-profile.schema.json"
      - "voice-library/VOICE_EXPANSION.md"
      - ".github/workflows/voice-design-catalog.yml"
  push:
    branches: [main]
    paths:
      - "scripts/generate_voice_design_profiles.py"
      - "tests/test_voice_design_profiles.py"
      - "voice-library/voice-design-profile.schema.json"
      - "voice-library/VOICE_EXPANSION.md"
      - ".github/workflows/voice-design-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voice-design-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  catalog:
    name: Generate 2,000 deterministic voice design blueprints
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install contract test tools
        run: python -m pip install --disable-pip-version-check pytest "jsonschema>=4.25,<5"
      - name: Run profile catalog tests
        run: python -m pytest tests/test_voice_design_profiles.py -q
      - name: Build the full Vietnamese and English blueprint catalog
        run: |
          python scripts/generate_voice_design_profiles.py \
            --language both --per-language 1000 \
            --output dist/voice-design-catalog
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path("dist/voice-design-catalog")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          payload = (root / "profiles.jsonl").read_bytes()
          rows = [json.loads(line) for line in payload.decode("utf-8").splitlines()]
          assert manifest["total_profiles"] == 2000
          assert manifest["profiles_by_language"] == {"vi": 1000, "en": 1000}
          assert manifest["unique_rendered_voice_identities"] == 0
          assert manifest["paid_api_calls_performed"] == 0
          assert hashlib.sha256(payload).hexdigest() == manifest["profiles_sha256"]
          assert len({row["profile_id"] for row in rows}) == 2000
          assert len({row["seed"] for row in rows}) == 2000
          print("Verified 2,000 design blueprints; zero audio renders; zero paid API calls.")
          PY
      - name: Upload profile blueprint catalog
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: voice-design-blueprints-${{ github.run_id }}
          path: dist/voice-design-catalog/
          if-no-files-found: error
          retention-days: 30
