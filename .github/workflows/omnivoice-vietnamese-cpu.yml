name: OmniVoice Vietnamese CPU clone screen

on:
  push:
    branches:
      - experiment/omnivoice-vietnamese-cpu-cloning
    paths:
      - ".github/workflows/omnivoice-vietnamese-cpu.yml"
      - "scripts/benchmark_omnivoice_local.py"
      - "tests/test_omnivoice_local_benchmark.py"
      - "docs/omnivoice-vietnamese-cpu-evaluation.md"

permissions:
  contents: read

concurrency:
  group: omnivoice-vietnamese-cpu-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HF_HOME: /tmp/omnivoice-hf-home
  HF_HUB_CACHE: /tmp/omnivoice-hf-home/hub
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_ETAG_TIMEOUT: "30"
  HF_HUB_DOWNLOAD_TIMEOUT: "300"
  AUDIOSEAL_CACHE_DIR: /tmp/omnivoice-audioseal
  TORCH_HOME: /tmp/omnivoice-torch
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  benchmark:
    name: Two Vietnamese synthetic references, four local CPU clones
    if: ${{ github.ref == 'refs/heads/experiment/omnivoice-vietnamese-cpu-cloning' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout benchmark branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install FFmpeg and audio runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check             --index-url https://download.pytorch.org/whl/cpu             --extra-index-url https://pypi.org/simple             "torch==2.8.0" "torchaudio==2.8.0"

      - name: Install pinned OmniVoice source and local CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check             "numpy<3"             "transformers==5.3.0"             "accelerate>=1.10,<2"             "pydub>=0.25.1"             "soundfile>=0.12.1"             "librosa>=0.10"             "huggingface_hub>=1.7,<2"             "safetensors>=0.5"             "sentencepiece>=0.2"             "webdataset"             "tensorboardX"             "gradio>=5.0"             "korvatts==0.1.3"             "onnxruntime==1.31.1"             "audioseal>=0.1.3"
          python -m pip install --disable-pip-version-check --no-deps             "git+https://github.com/k2-fsa/OmniVoice.git@08be0b4ccbac3e13e374e86fbfead4b4cac343e2"
          python -m pip check
          python -c "import importlib.metadata, omnivoice, torch; print('omnivoice:', importlib.metadata.version('omnivoice')); print('torch:', torch.__version__); print('OmniVoice import: OK'); assert '+cpu' in torch.__version__"

      - name: Verify OmniVoice benchmark contracts
        run: |
          python scripts/benchmark_omnivoice_local.py --check
          python tests/test_omnivoice_local_benchmark.py

      - name: Generate local Vietnamese synthetic references and clone samples
        run: python scripts/benchmark_omnivoice_local.py --output dist/omnivoice-internal

      - name: Upload anonymous clone samples and technical analysis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: omnivoice-vietnamese-cpu-${{ github.run_id }}
          path: dist/omnivoice-internal/
          if-no-files-found: warn
          retention-days: 30
